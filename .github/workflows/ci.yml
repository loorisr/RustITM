name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Generate GDAL COG test tiles
        run: |
          pip install rasterio
          python3 scripts/make_tiles.py "$RUNNER_TEMP/tiles"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
        env:
          ITM_TEST_TILES: ${{ runner.temp }}/tiles
      - name: Check web UI JavaScript syntax
        run: node --check crates/server/web/app.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: itm-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name itm -p 8080:8080 -e DEM_DOWNLOAD=false itm-api:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/v1/info
          curl -fs localhost:8080/ | grep -q "<title>"
          curl -fs -X POST localhost:8080/v1/p2p -H 'content-type: application/json' \
            -d '{"tx":{"lat":0.5,"lon":-30.5,"height_m":30},"rx":{"lat":0.6,"lon":-30.4,"height_m":2},"frequency_mhz":446}'
          docker exec itm /itm-server healthcheck
          docker run --rm itm-api:ci --version
          sleep 35; test "$(docker inspect -f '{{.State.Health.Status}}' itm)" = healthy
          docker image ls itm-api:ci
