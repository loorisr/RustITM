[package]
name="itm-server"
version = "0.2.0"
edition="2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.8", features = ["derive", "env"] }
itm = { version = "0.2.0", path = "../itm" }
lru = "0.19.0"
png = "0.18.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiff = "0.11.3"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "2"

[dev-dependencies]
tempfile = "3.27.0"
